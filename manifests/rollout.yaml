
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: go-simple-webserver
  labels:
    app: go-simple-webserver
spec:
  replicas: 10
  strategy:
    canary:
      steps:
        - setWeight: 50
        - pause: { duration: 60s }
        - setWeight: 100
  selector:
    matchLabels:
      app: go-simple-webserver
  template:
    metadata:
      labels:
        app: go-simple-webserver
    spec:
      containers:
        - name: webserver
          image: ghcr.io/alexandrupites/ci_cd_lab@sha256:a30ebe4a322d240e74495e8c419d680d0ca9561b4ff96b855805bf6d59bdc314
          ports:
            - containerPort: 8080
          imagePullPolicy: Always
